server {
    listen 80;
    server_name localhost;
    root /var/www/html/public; # Set the root to the public directory

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php; # The default file to look for

    charset utf-8;

    # This location block handles all requests
    location / {
        # First, try to serve the request as a file (e.g., /css/app.css)
        # If not found, try it as a directory
        # If still not found, pass it to index.php (the Laravel front controller)
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # This passes all .php file requests to your PHP-FPM container
    location ~ \.php$ {
        # Connect to the PHP-FPM container named 'app' on port 9000
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }
}
