name: Build and Push Service

on:
  push:
    branches:
      - public-main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: QEMU
        uses: docker/setup-qemu-action@v2

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: App image
        id: build-app
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: hocken123/app-uc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Nginx image
        id: build-nginx
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: hocken123/nginx-uc:latest 
          cache-from: type=gha
          cache-to: type=gha,mode=max
