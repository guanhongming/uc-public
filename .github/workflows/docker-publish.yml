name: Build and Push Service

on:
  push:
    branches:
      - public-main
      - staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set Image Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/public-main" ]]; then
            echo "TAG_SUFFIX=main" >> $GITHUB_ENV
            echo "APP_BASE_URL=/build/" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "TAG_SUFFIX=develop" >> $GITHUB_ENV
            echo "APP_BASE_URL=/staging/build/" >> $GITHUB_ENV
          fi

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push App image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/guanhongming/uc-public:app-${{ env.TAG_SUFFIX }}
          build-args: |
            VITE_APP_BASE_URL=${{ env.APP_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Nginx image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ghcr.io/guanhongming/uc-public:web-${{ env.TAG_SUFFIX }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
